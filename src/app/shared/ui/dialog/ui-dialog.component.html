<div class="dialog__frame" (click)="keepOpen($event)">
  <section class="dialog__card">
    <header class="dialog__header">
      <div>
        <h2 class="dialog__title" id="ui-dialog-title">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="dialog__subtitle">{{ subtitle() }}</p>
        }
      </div>
      <ui-icon-button icon="close" label="Cerrar" (click)="closed.emit()" />
    </header>
    <div class="dialog__body">
      <ng-content />
    </div>
    <footer class="dialog__footer">
      <ng-content select="[dialog-footer]" />
    </footer>
  </section>
</div>
