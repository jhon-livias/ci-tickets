<ui-page-header [items]="crumbs" title="Equipo de TI" description="Administra integrantes, horarios y funciones del equipo.">
  <ui-button (click)="openCreate()">Crear colaborador</ui-button>
</ui-page-header>
<ui-filter-bar>
  <ui-field id="team-name" label="Apellidos y nombres" [(value)]="nameQuery" />
  <ui-field id="team-dni" label="DNI" [(value)]="documentQuery" />
</ui-filter-bar>
<div class="mt-6">
  <ui-table [columns]="columns" [rows]="rows()" [actions]="true" [allowView]="true" [allowEdit]="true" [allowRemove]="true" (view)="open($event)" (edit)="open($event)" (remove)="confirmRemove($event)" />
</div>
@if (selected(); as member) {
  <ui-dialog [title]="member.isManager ? 'Responsable del área' : (member.id ? 'Editar colaborador' : 'Crear colaborador')" (closed)="selected.set(null)">
    @if (notice()) { <ui-alert tone="warning">{{ notice() }}</ui-alert> }
    <div class="mt-4 grid gap-4">
      <ui-field id="member-name" label="Nombres y apellidos" [disabled]="member.isManager" [(value)]="fullName" />
      <ui-field id="member-dni" label="DNI" [disabled]="member.isManager" [(value)]="document" />
      <ui-field id="member-role" label="Cargo" [disabled]="member.isManager" [(value)]="roleTitle" />
      <ui-field id="member-email" label="Correo" [disabled]="member.isManager" [(value)]="email" />
      <ui-field id="member-phone" label="Teléfono" [disabled]="member.isManager" [(value)]="phone" />
      <ui-field id="member-functions" label="Funciones" type="textarea" [(value)]="functions" />
      <ui-field id="member-schedule" label="Horario de trabajo" type="textarea" [(value)]="schedule" />
    </div>
    <div dialog-footer class="flex gap-3">
      <ui-button variant="secondary" (click)="selected.set(null)">Cancelar</ui-button>
      <ui-button (click)="save()">Guardar</ui-button>
    </div>
  </ui-dialog>
}
@if (removing(); as member) {
  <ui-confirm title="Eliminar colaborador" [message]="'¿Eliminar a ' + member.fullName + ' del equipo?'" (cancelled)="removing.set(null)" (confirmed)="remove()" />
}
