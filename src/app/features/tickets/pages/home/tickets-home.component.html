<main class="min-h-dvh bg-[#fcf9fa]">
  <header class="relative z-20 flex h-18 items-center justify-between px-5 sm:h-20 sm:px-8"><button class="grid size-10 place-items-center rounded-lg text-[#5e5254] hover:bg-[#faf6f7] lg:hidden" type="button" (click)="toggleMenu()" aria-label="Abrir menú">☰</button><span></span><div class="-mr-5 flex h-full items-center gap-3 rounded-bl-[2rem] bg-[#a9002d] px-5 text-white sm:-mr-8 sm:px-8"><img class="h-7 w-auto sm:h-9" src="/assets/layout/logo-profile.svg" alt="" /><span class="font-[var(--font-geist)] text-lg font-black sm:text-[28px]">UPRIT TICKETS</span><button class="grid size-9 place-items-center rounded-full hover:bg-white/15" type="button" (click)="toggleProfile()" aria-label="Ver perfil"><img class="h-7 w-auto" src="/assets/layout/profile.svg" alt="" /></button></div></header>
  <aside class="fixed inset-y-0 left-0 z-30 flex w-72 flex-col bg-[#a9002d] pt-24 text-white shadow-2xl transition-transform lg:absolute lg:top-20 lg:w-60 lg:translate-x-0 lg:rounded-tr-[4.5rem] lg:pt-8 lg:shadow-none" [class.-translate-x-full]="!menuOpen()" aria-label="Navegación de Tickets"><nav class="space-y-1 px-3"><a class="flex min-h-12 items-center gap-3 rounded-lg bg-[#c44760] px-4 text-sm font-semibold" routerLink="/">⌂ Inicio</a><a class="flex min-h-12 items-center gap-3 rounded-lg px-4 text-sm font-semibold hover:bg-white/15" href="#">▣ Mis tickets</a><a class="flex min-h-12 items-center gap-3 rounded-lg px-4 text-sm font-semibold hover:bg-white/15" href="#">＋ Nuevo ticket</a></nav></aside>
  <section class="px-6 py-8 sm:px-10 sm:py-10 lg:ml-60 lg:px-14 lg:py-12"><p class="text-xs text-[#7c8691]">Inicio</p><h1 class="mt-5 font-[var(--font-heading)] text-2xl font-semibold tracking-tight text-[#a9002d] sm:text-3xl">Bienvenido a UPRIT TICKETS, {{ displayName() }}</h1><div class="mt-8 grid gap-5 sm:grid-cols-3"><article class="rounded-2xl bg-white p-6 shadow-sm"><p class="text-sm text-[#7c8691]">Tickets abiertos</p><p class="mt-2 text-3xl font-semibold text-[#a9002d]">0</p></article><article class="rounded-2xl bg-white p-6 shadow-sm"><p class="text-sm text-[#7c8691]">En atención</p><p class="mt-2 text-3xl font-semibold text-[#a9002d]">0</p></article><article class="rounded-2xl bg-white p-6 shadow-sm"><p class="text-sm text-[#7c8691]">Resueltos</p><p class="mt-2 text-3xl font-semibold text-[#a9002d]">0</p></article></div></section>
  <aside class="absolute right-0 top-18 z-20 w-72 rounded-bl-2xl bg-[#eed6db] px-4 py-4 text-[#1e1e1e] shadow-lg transition-transform" [class.translate-x-full]="!profileOpen()"><div class="flex items-center gap-3"><img class="size-9" src="/assets/layout/menu-profile.svg" alt="" /><p class="text-sm font-semibold">{{ displayName() }}</p></div><div class="mt-4 h-px bg-white"></div><button class="mt-4 flex h-10 w-full items-center justify-center gap-2 rounded-full bg-white text-sm font-semibold text-[#a81a39]" type="button" (click)="logout()"><img class="size-4" src="/assets/layout/logout.svg" alt="" />Cerrar sesión</button></aside>
</main>
