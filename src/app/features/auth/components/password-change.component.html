<form class="space-y-4" (submit)="save($event)">
  <p class="text-sm">Tu contraseña inicial es tu DNI. Elige una nueva antes de continuar. La autenticación de doble factor sigue activa.</p>
  @if (notice()) { <ui-alert tone="warning">{{ notice() }}</ui-alert> }
  <ui-field id="new-password" label="Nueva contraseña" type="password" [required]="true" hint="Mínimo 8 caracteres." [showPasswordToggle]="true" [error]="passwordError()" [value]="password()" (valueChange)="password.set($event)" />
  <ui-field id="confirm-password" label="Confirmar contraseña" type="password" [required]="true" [showPasswordToggle]="true" [error]="confirmationError()" [value]="confirmation()" (valueChange)="confirmation.set($event)" />
  <ui-button type="submit" [disabled]="submitting()">{{ submitting() ? 'Guardando…' : 'Cambiar contraseña' }}</ui-button>
</form>
